blueprint:
  name: "🍿 SmartPlex: Вечерняя Кинорулетка в ВКонтакте (VK Notify)"
  description: >-
    Отправляет нумерованный коллаж фильмов из Plex Media Server в выбранный чат
    VK Notify по расписанию (или вручную через «Выполнить действия») и обрабатывает
    инлайн-кнопки мгновенного запуска фильма на ТВ и перекрутки вариантов.
    Не требует настройки allowlist_external_dirs.
  domain: automation
  author: Eugen417
  homeassistant:
    min_version: "2026.9.0"
  input:
    vk_notify_entity:
      name: Чат ВКонтакте (VK Notify)
      description: Выберите сущность notify.vk_notify_* чата или беседы, куда отправлять афишу.
      selector:
        entity:
          filter:
            - domain: notify
              integration: vk_notify
    schedule_time:
      name: Время ежедневной отправки
      description: Во сколько присылать вечернюю подборку фильмов.
      default: "20:00:00"
      selector:
        time: {}
    roulette_preset:
      name: Пресет Кинорулетки
      description: Название пресета из настроек SmartPlex (оставьте пустым для пресета по умолчанию).
      default: ""
      selector:
        text: {}
    target_zone:
      name: Медиа-зона (телевизор / приставка)
      description: Название медиа-зоны SmartPlex, например «Зал» (оставьте пустым для зоны по умолчанию).
      default: ""
      selector:
        text: {}
    show_snackbar:
      name: Показывать всплывающий снэкбар в ВК при нажатии кнопок
      description: Показывает уведомление «Запускаю фильм...» / «Подбираю варианты...» в приложении ВК.
      default: true
      selector:
        boolean: {}

mode: queued
max: 10

variables:
  notify_entity: !input vk_notify_entity
  default_preset: !input roulette_preset
  default_zone: !input target_zone
  show_snackbar: !input show_snackbar

triggers:
  - trigger: time
    at: !input schedule_time
    id: schedule
  - trigger: event
    event_type: vk_notify_callback
    id: vk_callback

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: schedule
      - condition: template
        value_template: >-
          {% set raw_p = trigger.event.data.get('payload', {}) %}
          {% set p = (raw_p | from_json) if (raw_p is string and raw_p.startswith('{')) else (raw_p if raw_p is mapping else {}) %}
          {{ trigger.event.data.get('entity_id') == notify_entity
             and p.get('cmd') in ['plex_play', 'plex_reroll'] }}

actions:
  - variables:
      is_callback: "{{ trigger is defined and trigger.id == 'vk_callback' }}"
      cb_payload: >-
        {% if is_callback %}
          {% set raw_p = trigger.event.data.get('payload', {}) %}
          {{ (raw_p | from_json) if (raw_p is string and raw_p.startswith('{')) else (raw_p if raw_p is mapping else {}) }}
        {% else %}
          {{ {} }}
        {% endif %}
      cb_cmd: "{{ cb_payload.get('cmd', '') if cb_payload is mapping else '' }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_callback and cb_cmd == 'plex_play' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ show_snackbar }}"
            then:
              - action: vk_notify.answer_callback
                target:
                  entity_id: !input vk_notify_entity
                data:
                  event_id: "{{ trigger.event.data.event_id }}"
                  user_id: "{{ trigger.event.data.user_id }}"
                  message: "🎬 Запускаю фильм на Plex..."
                continue_on_error: true

          - action: plex_smart.play
            data:
              rating_key: "{{ cb_payload.get('key') | int }}"
              zone: "{{ cb_payload.get('zone') or default_zone }}"
            response_variable: play_res

          - action: vk_notify.send_message
            target:
              entity_id: !input vk_notify_entity
            data:
              message: "🎬 {{ play_res.message }}"
              parse_mode: plain

      - conditions:
          - condition: template
            value_template: "{{ (not is_callback) or cb_cmd == 'plex_reroll' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_callback and show_snackbar }}"
            then:
              - action: vk_notify.answer_callback
                target:
                  entity_id: !input vk_notify_entity
                data:
                  event_id: "{{ trigger.event.data.event_id }}"
                  user_id: "{{ trigger.event.data.user_id }}"
                  message: "🔄 Подбираю другие варианты..."
                continue_on_error: true

          - action: plex_smart.spin_roulette
            data:
              preset: "{{ (cb_payload.get('preset') if is_callback else '') or default_preset }}"
              zone: "{{ (cb_payload.get('zone') if is_callback else '') or default_zone }}"
            response_variable: roulette

          - if:
              - condition: template
                value_template: "{{ roulette.success }}"
            then:
              - action: vk_notify.send_photo
                target:
                  entity_id: !input vk_notify_entity
                data:
                  url: "{{ roulette.image_url }}"
                  message: "{{ roulette.message }}"
                  parse_mode: plain
                  inline_keyboard: true
                  auto_answer_callback: "{{ not show_snackbar }}"
                  keyboard: "{{ roulette.vk_keyboard }}"
            else:
              - action: vk_notify.send_message
                target:
                  entity_id: !input vk_notify_entity
                data:
                  message: "⚠️ {{ roulette.message }}"
                  parse_mode: plain
