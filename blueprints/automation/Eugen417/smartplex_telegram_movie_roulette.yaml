blueprint:
  name: "🍿 SmartPlex: Вечерняя Кинорулетка в Telegram"
  description: >-
    Отправляет нумерованный коллаж фильмов из Plex Media Server в выбранный чат
    Telegram Bot (Home Assistant 2026.9+ и сущности notify.telegram_bot_*)
    и обрабатывает инлайн-кнопки запуска и перекрутки. Без allowlist_external_dirs.
  domain: automation
  author: Eugen417
  homeassistant:
    min_version: "2026.9.0"
  input:
    telegram_notify_entity:
      name: Чат Telegram Bot
      description: Выберите сущность notify.telegram_bot_* разрешённого чата или группы.
      selector:
        entity:
          filter:
            - domain: notify
              integration: telegram_bot
    schedule_time:
      name: Время ежедневной отправки
      description: Во сколько присылать вечернюю подборку фильмов.
      default: "20:00:00"
      selector:
        time: {}
    roulette_preset:
      name: Пресет Кинорулетки
      description: Название пресета SmartPlex (пусто — пресет по умолчанию).
      default: ""
      selector:
        text: {}
    target_zone:
      name: Медиа-зона (телевизор / приставка)
      description: Название зоны SmartPlex, например «Зал» (пусто — зона по умолчанию).
      default: ""
      selector:
        text: {}

mode: queued
max: 10

variables:
  notify_entity: !input telegram_notify_entity
  default_preset: !input roulette_preset
  default_zone: !input target_zone

triggers:
  - trigger: time
    at: !input schedule_time
    id: schedule
  - trigger: event
    event_type: telegram_callback
    id: tg_callback

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: schedule
      - condition: template
        value_template: "{{ (trigger.event.data.get('data') | default('', true)).startswith('/plex_') }}"

actions:
  - variables:
      is_callback: "{{ trigger is defined and trigger.id == 'tg_callback' }}"
      cb_data: "{{ (trigger.event.data.get('data') | default('', true)) if is_callback else '' }}"
      parts: "{{ cb_data.split(':') if cb_data else [] }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_callback and cb_data.startswith('/plex_play:') }}"
        sequence:
          - action: telegram_bot.answer_callback_query
            data:
              config_entry_id: "{{ trigger.event.data.bot.config_entry_id }}"
              callback_query_id: "{{ trigger.event.data.id }}"
              message: "🎬 Запускаю фильм на Plex..."
              show_alert: false
            continue_on_error: true
          - action: plex_smart.play
            data:
              rating_key: "{{ parts[1] | int }}"
              zone: "{{ parts[2] if (parts | length > 2 and parts[2]) else default_zone }}"
            response_variable: play_res
          - action: telegram_bot.send_message
            data:
              config_entry_id: "{{ trigger.event.data.bot.config_entry_id }}"
              chat_id: "{{ trigger.event.data.chat_id }}"
              message: "🎬 {{ play_res.message }}"
              parse_mode: plain_text

      - conditions:
          - condition: template
            value_template: "{{ (not is_callback) or cb_data.startswith('/plex_reroll:') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_callback }}"
            then:
              - action: telegram_bot.answer_callback_query
                data:
                  config_entry_id: "{{ trigger.event.data.bot.config_entry_id }}"
                  callback_query_id: "{{ trigger.event.data.id }}"
                  message: "🔄 Подбираю другие варианты..."
                  show_alert: false
                continue_on_error: true
          - action: plex_smart.spin_roulette
            data:
              preset: "{{ parts[1] if (is_callback and parts | length > 1 and parts[1]) else default_preset }}"
              zone: "{{ parts[2] if (is_callback and parts | length > 2 and parts[2]) else default_zone }}"
            response_variable: roulette
          - if:
              - condition: template
                value_template: "{{ roulette.success }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ is_callback }}"
                then:
                  - action: telegram_bot.send_photo
                    data:
                      config_entry_id: "{{ trigger.event.data.bot.config_entry_id }}"
                      chat_id: "{{ trigger.event.data.chat_id }}"
                      url: "{{ roulette.image_url }}"
                      verify_ssl: false
                      caption: "{{ roulette.message }}"
                      parse_mode: plain_text
                      inline_keyboard: "{{ roulette.telegram_inline_keyboard }}"
                else:
                  - action: telegram_bot.send_photo
                    data:
                      entity_id: !input telegram_notify_entity
                      url: "{{ roulette.image_url }}"
                      verify_ssl: false
                      caption: "{{ roulette.message }}"
                      parse_mode: plain_text
                      inline_keyboard: "{{ roulette.telegram_inline_keyboard }}"
            else:
              - action: telegram_bot.send_message
                data:
                  entity_id: !input telegram_notify_entity
                  message: "⚠️ {{ roulette.message }}"
                  parse_mode: plain_text
